{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <!-- Page Header -->
    <div class="row mb-4 align-items-center">
        <div class="col-2">
            <a href="{{ url_for('calendar.show_calendar') }}" class="btn btn-outline-primary">
                &lt; Back
            </a>
        </div>
        <div class="col-8 text-center">
            <h3>Create New Activity</h3>
        </div>
        <div class="col-2"></div>
    </div>

    <!-- Activity Form -->
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">Activity Information</h5>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('calendar.create_activity') }}">

                        <!-- Activity Name -->
                        <div class="mb-3">
                            <label for="name" class="form-label">Activity Name</label>
                            <input type="text" class="form-control" id="name" name="name" placeholder="Enter activity name" required>
                        </div>

                        <!-- Meeting Details / Description -->
                        <div class="mb-3">
                            <label for="detail" class="form-label">Meeting Details / Description</label>
                            <textarea class="form-control" id="detail" name="detail" rows="3" placeholder="Enter details about the meeting or conference..."></textarea>
                        </div>

                        <!-- Room Selection -->
                        <div class="mb-3">
                            <label for="room_id" class="form-label">Select Room</label>
                            <select class="form-select" id="room_id" name="room_id" required>
                                <option value="" selected disabled>Choose a room</option>
                                {% for room in rooms %}
                                    <option value="{{ room.id }}">{{ room.name }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <!-- Participants Selection -->
                        <div class="mb-3">
                            <label for="participant_ids" class="form-label">Participants</label>
                            <select class="form-select" id="participant_ids" name="participant_ids" multiple style="height: 120px;">
                                {% for user in users %}
                                    {% if user.id != current_user.id %}
                                        <option value="{{ user.id }}">{{ user.username }}</option>
                                    {% endif %}
                                {% endfor %}
                            </select>
                            <div class="form-text">Hold down Ctrl (Windows) or Cmd (Mac) to select multiple participants.</div>
                        </div>

                        <!-- Buttons -->
                        <div class="d-flex justify-content-between mt-4">
                            <a href="{{ url_for('calendar.show_calendar') }}" class="btn btn-outline-secondary">
                                Cancel
                            </a>
                            <button type="submit" class="btn btn-primary">
                                Create Activity
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>

</div>

{% endblock %}
